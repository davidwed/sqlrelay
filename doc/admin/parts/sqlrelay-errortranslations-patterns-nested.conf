<?xml version="1.0"?>
<instances>
	...
	<instance id="example" ... >
		...
		<errortranslations>
			<errortranslation module="patterns">
				<pattern type="regex"
					match="^ORA-00955:.*">
					<pattern type="string"
						from="name is already in use by an existing object"
						to="Table already exists"/>
				</pattern>
				<pattern type="regex"
					match="^ORA-00942:.*">
					<pattern type="string"
						from="table or view does not exist"
						to="Unknown table"/>
				</pattern>
			</errortranslation>
		</errortranslations>
		...
	</instance>
	...
</instances>
